---
- name: Create project directory
  file:
    path: "{{ DEPLOY_DIR }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Copy project files to server
  synchronize:
    src: "../"
    dest: "{{ DEPLOY_DIR }}/"
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=__pycache__"
      - "--exclude=.pytest_cache"

- name: Start application via Docker Compose
  shell:
    cmd: "docker compose up -d --build"
    chdir: "{{ DEPLOY_DIR }}"
  register: compose_output

- name: Wait for Health Endpoint to respond
  uri:
    url: "http://localhost:{{ APP_PORT }}/health"
    status_code: 200
  retries: 6
  delay: 5
  register: result
  until: result.status == 200
