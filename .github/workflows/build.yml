name: CI Pipeline

# Настройка триггеров: запуск при push и pull request в ветку main
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout кода из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Автоматическое кэширование зависимостей для ускорения сборки

      # 3. Установка зависимостей Python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # 4. Линтинг Bash-скриптов с помощью shellcheck
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint Bash scripts
        run: shellcheck scripts/*.sh

      # 5. Запуск тестов (pytest)
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest

      # 6. Сборка Docker-образа
      - name: Build Docker image
        run: |
          docker build -t simple-app:latest .

      # 7. Запуск через Docker Compose и проверка его здоровья
      - name: Test container health
        run: |
          # Поднимаем сервис с помощью нашего docker-compose.yml
          docker compose up -d
          
          echo "Waiting for container to become healthy..."
          
          # Цикл ожидания (максимум 60 секунд)
          for i in {1..12}; do
            # Проверяем, есть ли контейнер с именем simple_app_container и статусом healthy
            # Если он healthy, команда вернет его имя. Если нет — вернет пустоту.
            HEALTH_CHECK=$(docker ps --filter "name=simple_app_container" --filter "health=healthy" --format "{{.Names}}")
            
            if [ -n "$HEALTH_CHECK" ]; then
              echo "Success: Container is healthy!"
              docker compose down
              exit 0
            fi
            
            echo "Container is not ready yet, retrying in 5 seconds (attempt $i/12)..."
            sleep 5
          done
          
          # Если контейнер не стал healthy, выводим отладочную информацию
          echo "Error: Container failed to become healthy in time."
          echo "=== Docker Compose Logs ==="
          docker compose logs
          
          # Показываем детальный лог хелсчека из инспекта, чтобы сразу увидеть ошибку в UI GitHub
          echo "=== Detailed Healthcheck Output ==="
          docker inspect simple_app_container --format='{{json .State.Health.Log}}'
          
          docker compose down
          exit 1

