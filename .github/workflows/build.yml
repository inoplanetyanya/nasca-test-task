name: CI Pipeline

# Настройка триггеров: запуск при push и pull request в ветку main
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout кода из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Автоматическое кэширование зависимостей для ускорения сборки

      # 3. Установка зависимостей Python
      - name: Install dependencies
        run: make install

      # 4. Линтинг
      - name: Install shellcheck
        run: make lint

      # 5. Запуск тестов (pytest)
      - name: Run tests
        run: make test

      # 6. Сборка Docker-образа
      - name: Build Docker image
        run: make docker-build

      # 7. Запуск через Docker Compose и проверка его здоровья
      - name: Test container health
        run: |
          make compose-up
          echo "Waiting for container to become healthy..."
          
          for i in {1..12}; do
            # Берем CONTAINER_NAME из .env, чтобы избежать жесткого хардкода
            CONTAINER_NAME=$(sed -n 's/^CONTAINER_NAME=//p' .env)
            HEALTH_CHECK=$(docker ps --filter "name=${CONTAINER_NAME}" --filter "health=healthy" --format "{{.Names}}")
            
            if [ -n "$HEALTH_CHECK" ]; then
              echo "Success: Container is healthy!"
              make compose-down
              exit 0
            fi
            
            echo "Container is not ready yet, retrying in 5 seconds (attempt $i/12)..."
            sleep 5
          done
          
          echo "Error: Container failed to become healthy in time."
          make compose-logs
          make compose-down
          exit 1

